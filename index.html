/* Layout: a fixed 1920x1080 stage scaled to fit any screen; every scene is a layer of reveal "beats" driven by clicker or keyboard. */
:root{
  color-scheme:dark;
  --ink:#070608;      /* stage black */
  --coal:#131013;     /* panels */
  --ash:#2b2427;      /* hairlines */
  --bone:#f3ece8;     /* primary text */
  --smoke:#a1959a;    /* secondary text */
  --red:#e5121f;      /* OFTI red */
  --ember:#ff4b3e;    /* highlight red */
  --blood:#6e0710;    /* deep red */
  --disp:'Big Shoulders Display','Bahnschrift Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --arab:'Noto Kufi Arabic','Geeza Pro',Tahoma,sans-serif;
}
html,body{height:100%;margin:0;background:#000;color:var(--bone);overflow:hidden;font-family:var(--body)}
#viewport{position:fixed;inset:0;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ink);font-family:var(--body);color:var(--bone)}
#fx{position:absolute;inset:0;width:1920px;height:1080px;z-index:0}
#scene{position:absolute;inset:0;z-index:2}
.sc{position:absolute;inset:0;animation:scIn .7s ease both}
@keyframes scIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.instant,.instant *{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}

/* chrome */
#chrome{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .6s}
#chrome.off{opacity:0}
.brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px;font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:.08em}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 18px var(--red);animation:pulse 2.4s infinite}
.brand b{color:var(--red)}
.part{position:absolute;right:72px;top:62px;font-family:var(--mono);font-size:22px;letter-spacing:.2em;color:var(--smoke);text-transform:uppercase}
.illus{position:absolute;left:72px;bottom:44px;font-family:var(--mono);font-size:20px;letter-spacing:.14em;color:var(--smoke);text-transform:uppercase;opacity:0;transition:opacity .5s}
.illus.on{opacity:1}
#hud{position:absolute;right:40px;bottom:30px;z-index:9;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:16px;color:#5d5357;transition:opacity .4s}
#hud.off{opacity:0}
#hud span{width:8px;height:8px;border-radius:50%;background:#2b2427}
#hud span.on{background:var(--red)}
#hud em{font-style:normal;margin-left:10px}
#black{position:absolute;inset:0;background:#000;z-index:20;opacity:0;pointer-events:none;transition:opacity .5s}
#black.on{opacity:1}

/* notes */
#notes{position:absolute;left:0;right:0;bottom:0;z-index:15;background:rgba(10,8,9,.94);border-top:2px solid var(--red);padding:22px 72px 26px;display:none;font-size:26px;line-height:1.4}
#notes.on{display:block}
#notes .who{font-family:var(--mono);font-size:20px;letter-spacing:.16em;color:var(--ember);margin-right:14px}
#notes .nx{color:var(--smoke);font-size:22px;margin-top:8px}
#notes .bonus{font-family:var(--mono);font-size:16px;background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;margin-left:10px;letter-spacing:.1em}

/* type */
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--smoke)}
.lbl.r{color:var(--ember)}
.hero{font-family:var(--disp);font-weight:900;font-size:260px;line-height:.86;letter-spacing:.01em;margin:0;text-wrap:balance}
.h1{font-family:var(--disp);font-weight:900;font-size:150px;line-height:.9;margin:0;text-wrap:balance}
.h2{font-family:var(--disp);font-weight:700;font-size:92px;line-height:.95;margin:0;text-wrap:balance}
.big{font-size:52px;line-height:1.2;font-weight:500;text-wrap:balance}
.body{font-size:38px;line-height:1.35}
.red{color:var(--red)}
.ember{color:var(--ember)}
.dim{color:var(--smoke)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px}

/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .7s}
.rv.in{opacity:1;transform:none}
.rv.blur{filter:blur(16px)}
.rv.blur.in{filter:none}
.rv.pop{transform:scale(.6)}
.rv.pop.in{transform:none;transition:opacity .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.rv.left{transform:translateX(-60px)}
.rv.left.in{transform:none}
.gone{opacity:.12!important;transition:opacity .6s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* standby */
.arm{pointer-events:auto;margin-top:20px;font-family:var(--disp);font-weight:700;font-size:44px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--red);border:0;border-radius:999px;padding:22px 64px;cursor:pointer;box-shadow:0 0 60px rgba(229,18,31,.5)}
.arm:focus-visible{outline:4px solid var(--bone);outline-offset:6px}
.keys{font-family:var(--mono);font-size:20px;color:var(--smoke);max-width:1300px;line-height:1.8}
.keys b{color:var(--bone);border:1px solid var(--ash);border-radius:6px;padding:1px 9px;margin:0 4px;font-weight:600}

/* year odometer */
.year{font-family:var(--disp);font-weight:900;font-size:420px;line-height:.8;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--bone);text-shadow:0 0 80px rgba(229,18,31,.8)}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,var(--ember) 30%,transparent 70%);opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}

/* email card */
.mail{width:900px;background:var(--coal);border:1px solid var(--ash);border-radius:20px;padding:30px 40px;text-align:left;position:relative}
.mail .from{font-family:var(--mono);font-size:22px;color:var(--smoke)}
.mail .subj{font-size:40px;font-weight:700;margin-top:10px}
.stamp{position:absolute;font-family:var(--disp);font-weight:900;font-size:120px;letter-spacing:.08em;color:var(--red);border:10px solid var(--red);border-radius:16px;padding:0 30px;opacity:0;transform:scale(2.4) rotate(-9deg);mix-blend-mode:screen}
.stamp.in{opacity:1;transform:scale(1) rotate(-9deg);transition:opacity .2s,transform .4s cubic-bezier(.2,1.5,.4,1)}
.glitch{animation:glitch .5s steps(2) 3}
@keyframes glitch{0%{transform:translate(0);filter:none}25%{transform:translate(-8px,3px);filter:drop-shadow(6px 0 var(--red))}50%{transform:translate(7px,-4px);filter:drop-shadow(-6px 0 #0ff)}75%{transform:translate(-3px,0)}100%{transform:none}}

/* alert */
.siren{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(229,18,31,.0) 30%,rgba(229,18,31,.45) 100%);animation:siren 1s ease-in-out infinite;pointer-events:none}
@keyframes siren{0%,100%{opacity:.25}50%{opacity:1}}
.alert{position:absolute;left:160px;top:200px;width:1000px;background:#120607;border:2px solid var(--red);border-radius:24px;padding:44px 52px;box-shadow:0 0 120px rgba(229,18,31,.35)}
.alert .tag{display:inline-flex;gap:14px;align-items:center;font-family:var(--mono);font-size:24px;letter-spacing:.2em;color:#fff;background:var(--red);padding:8px 16px;border-radius:8px}
.alert h2{font-family:var(--disp);font-weight:900;font-size:110px;line-height:.92;margin:26px 0 18px}
.cd{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ember)}
.side{position:absolute;right:120px;top:200px;width:620px;display:flex;flex-direction:column;gap:22px}
.need{background:var(--coal);border:1px solid var(--ash);border-radius:18px;padding:22px 28px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.need b{font-family:var(--disp);font-size:46px;font-weight:700}
.need span{font-size:28px;color:var(--smoke)}
.invite{background:#1a1416;border-left:6px solid var(--red);border-radius:10px;padding:14px 22px;font-size:26px}
.invite small{display:block;font-family:var(--mono);font-size:18px;color:var(--smoke);margin-bottom:4px}
.guess{position:absolute;left:160px;bottom:150px;display:flex;align-items:center;gap:40px;font-family:var(--disp);font-weight:700;font-size:70px}
.guess .q{padding:10px 34px;border:3px solid var(--ash);border-radius:16px;animation:flip 1.2s infinite}
.guess .q:nth-child(3){animation-delay:.6s}
@keyframes flip{0%,100%{border-color:var(--ash);color:var(--smoke)}50%{border-color:var(--red);color:var(--bone)}}
.rewind{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);opacity:0;pointer-events:none;transition:opacity .3s}
.rewind.in{opacity:1}
.rewind .year{font-size:360px;animation:vhs .18s steps(2) infinite}
.rewind::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px)}
@keyframes vhs{0%{transform:translateX(0)}50%{transform:translateX(6px) skewX(-2deg)}}

/* calendar */
.cal{position:absolute;left:120px;top:170px;width:1680px;height:760px;background:#0e0b0d;border:1px solid var(--ash);border-radius:20px;overflow:hidden}
.cal .hd{display:grid;grid-template-columns:110px repeat(5,1fr);height:70px;border-bottom:1px solid var(--ash);font-family:var(--mono);font-size:22px;color:var(--smoke);align-items:center}
.cal .hd div{padding-left:16px}
.cal .hd .today{color:var(--ember)}
.cal .grid{position:absolute;left:0;right:0;top:70px;bottom:0}
.cal .hr{position:absolute;left:0;right:0;border-top:1px solid #1d181a;font-family:var(--mono);font-size:18px;color:#5d5357;padding:4px 0 0 16px}
.mt{position:absolute;border-radius:8px;background:#3a1015;border-left:5px solid var(--red);font-size:19px;line-height:1.2;padding:6px 10px;overflow:hidden;color:var(--bone);opacity:0;transform:scale(.7);transition:opacity .25s,transform .3s cubic-bezier(.2,1.5,.4,1),box-shadow .3s,background .3s}
.mt.in{opacity:1;transform:none}
.mt.hot{background:var(--red);box-shadow:0 0 40px rgba(229,18,31,.8);z-index:3}
.spoilw{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;z-index:4;pointer-events:none}
.spoiler{rotate:-4deg;background:var(--bone);color:var(--ink);font-family:var(--disp);font-weight:900;font-size:84px;padding:14px 44px;letter-spacing:.02em;white-space:nowrap;z-index:4;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.toast{position:absolute;right:140px;top:110px;z-index:6;display:flex;gap:22px;align-items:center;background:#16100f;border:2px solid var(--red);border-radius:20px;padding:22px 30px;width:760px;box-shadow:0 20px 80px rgba(0,0,0,.8)}
.toast .cap{font-size:28px;line-height:1.35;min-height:76px}

/* agents */
.av{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:50px;color:#fff;background:radial-gradient(circle at 35% 30%,var(--ember),var(--blood));box-shadow:0 0 0 4px var(--ink),0 0 0 6px var(--red);position:relative}
.av.sm{width:64px;height:64px;font-size:32px}
.av.human{background:radial-gradient(circle at 35% 30%,#4a4044,#1b1618);box-shadow:0 0 0 4px var(--ink),0 0 0 6px #5d5357}
.talk .av,.av.talk{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{from{box-shadow:0 0 0 4px var(--ink),0 0 0 6px var(--red),0 0 0 0 rgba(229,18,31,.6)}to{box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--ember),0 0 50px 18px rgba(229,18,31,.55)}}
.wave{display:inline-flex;gap:5px;align-items:center;height:40px;opacity:0;transition:opacity .3s}
.wave i{width:6px;height:10px;border-radius:3px;background:var(--ember)}
.talk .wave{opacity:1}
.talk .wave i{animation:wv .45s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s!important}.wave i:nth-child(3){animation-delay:.2s!important}.wave i:nth-child(4){animation-delay:.05s!important}.wave i:nth-child(5){animation-delay:.15s!important}
@keyframes wv{from{height:8px}to{height:38px}}

/* OneFamily */
.of-logo{position:absolute;left:0;right:0;top:262px;display:flex;flex-direction:column;align-items:center;gap:14px}
.of-word{font-family:var(--disp);font-weight:900;font-size:120px;letter-spacing:.02em;line-height:1}
.of-word b{color:var(--red)}
.agent-node{position:absolute;width:300px;margin-left:-150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.agent-node .nm{font-family:var(--disp);font-weight:900;font-size:50px;letter-spacing:.06em;line-height:1}
.agent-node .fn{font-size:24px;color:var(--smoke);line-height:1.25}
.rules{position:absolute;left:0;right:0;top:100px;display:flex;justify-content:center;gap:24px}
.rule{font-family:var(--mono);font-size:22px;letter-spacing:.08em;padding:10px 18px;border:1px solid var(--red);border-radius:999px;color:var(--bone);background:rgba(229,18,31,.08)}
.tagline{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-family:var(--disp);font-weight:900;font-size:110px;line-height:1}

/* meeting */
.mtg{position:absolute;inset:0}
.mtg .bar{position:absolute;left:60px;right:60px;top:40px;height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ash);font-size:28px}
.mtg .bar .rec{font-family:var(--mono);font-size:20px;letter-spacing:.14em;color:var(--ember);display:flex;gap:10px;align-items:center}
.mtg .bar .rec i{width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.mtg .bar .launch{font-family:var(--mono);font-size:22px;letter-spacing:.12em;color:var(--smoke);display:flex;gap:16px;align-items:baseline}
.mtg .bar .launch .cd{font-size:44px}
.tiles{position:absolute;left:60px;top:150px;width:1160px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tile{height:250px;background:var(--coal);border:2px solid var(--ash);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;transition:border-color .3s,transform .3s,background .3s}
.tile .nm{font-size:26px;font-weight:700}
.tile .rl{font-family:var(--mono);font-size:16px;letter-spacing:.12em;color:var(--smoke);text-transform:uppercase}
.tile.talk{border-color:var(--red);background:#1b0b0e;transform:scale(1.04)}
.tile .ai{position:absolute;z-index:2;background:var(--coal);top:12px;right:14px;font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:var(--ember);border:1px solid var(--blood);border-radius:6px;padding:2px 7px}
.ready{position:absolute;left:60px;top:700px;width:1160px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.seg{background:var(--coal);border:1px solid var(--ash);border-radius:14px;padding:16px 18px;min-height:150px;transition:all .4s}
.seg .k{font-family:var(--mono);font-size:17px;letter-spacing:.14em;color:var(--smoke);text-transform:uppercase}
.seg .v{font-size:23px;line-height:1.3;margin-top:10px;color:#5d5357}
.seg.ok{border-color:var(--bone)}
.seg.ok .v{color:var(--bone)}
.seg.flag{border-color:var(--red);background:#1b0b0e}
.seg.flag .v{color:var(--bone)}
.seg.flag .k{color:var(--ember)}
.chat{position:absolute;right:60px;top:150px;width:600px;height:880px;background:#0d0a0c;border:1px solid var(--ash);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;overflow:hidden}
.msg{display:flex;gap:14px;align-items:flex-start}
.msg .bub{background:var(--coal);border:1px solid var(--ash);border-radius:16px;padding:14px 18px;font-size:23px;line-height:1.38}
.msg .bub small{display:block;font-family:var(--mono);font-size:15px;letter-spacing:.12em;color:var(--ember);margin-bottom:4px}
.msg.h .bub small{color:var(--smoke)}
.msg.old .bub{font-size:18px;opacity:.55}
.brief{position:absolute;left:60px;top:880px;width:1160px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#1b0b0e;border:2px solid var(--red);border-radius:16px;padding:20px 26px;font-size:26px}
.brief .badge{font-size:18px}
.badge{font-family:var(--mono);font-size:22px;letter-spacing:.14em;color:#fff;background:var(--red);padding:10px 16px;border-radius:8px;white-space:nowrap}

/* judgment */
.opts{position:absolute;left:120px;right:120px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.opt{background:var(--coal);border:2px solid var(--ash);border-radius:22px;padding:36px;display:flex;flex-direction:column;gap:18px;min-height:360px;cursor:pointer;transition:border-color .3s}
.opt .n{font-family:var(--mono);font-size:22px;color:var(--smoke)}
.opt h3{font-family:var(--disp);font-weight:700;font-size:62px;line-height:1;margin:0}
.opt .vb{margin-top:auto;height:20px;border-radius:10px;background:#221c1f;overflow:hidden}
.opt .vb i{display:block;height:100%;width:0;background:var(--red);transition:width .4s cubic-bezier(.2,1.4,.4,1)}
.opt .vc{font-family:var(--mono);font-size:26px;color:var(--bone)}
.opt.lead{border-color:var(--red)}
.shield{position:absolute;inset:0;background:rgba(7,6,8,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;opacity:0;pointer-events:none;transition:opacity .4s}
.shield.in{opacity:1}
.shield .lock{font-family:var(--disp);font-weight:900;font-size:130px;line-height:1;color:#fff;background:var(--red);padding:16px 50px;border-radius:18px;letter-spacing:.03em;box-shadow:0 0 120px rgba(229,18,31,.6)}
.cap-line{display:flex;gap:24px;align-items:center;max-width:1300px;font-size:40px;line-height:1.3}
.quote{position:absolute;left:160px;right:160px;top:280px;font-family:var(--disp);font-weight:700;font-size:96px;line-height:1.02;text-wrap:balance}
.quote .who{display:block;font-family:var(--mono);font-weight:400;font-size:24px;letter-spacing:.2em;color:var(--ember);margin-bottom:26px}
.cc{position:absolute;left:160px;right:160px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cc .col{border-top:6px solid var(--bone);padding-top:26px;display:flex;flex-direction:column;gap:24px}
.cc .col.no{border-color:var(--red)}
.cc h3{font-family:var(--disp);font-weight:900;font-size:72px;margin:0;line-height:1}
.cc li{font-size:38px;line-height:1.3;list-style:none;padding-left:46px;position:relative}
.cc li::before{content:"";position:absolute;left:0;top:18px;width:24px;height:4px;background:var(--bone)}
.cc .no li::before{background:var(--red)}
.cc ul{margin:0;padding:0;display:flex;flex-direction:column;gap:18px}

/* decision */
.approved{position:absolute;left:120px;top:150px;width:1000px;font-family:var(--disp);font-weight:900;font-size:100px;line-height:.95;color:#fff;border:10px solid var(--red);border-radius:18px;padding:12px 36px;transform:rotate(-3deg) scale(2);opacity:0;background:rgba(229,18,31,.12)}
.approved.in{opacity:1;transform:rotate(-3deg);transition:opacity .15s,transform .4s cubic-bezier(.2,1.5,.4,1)}
.approved small{display:block;font-family:var(--mono);font-weight:400;font-size:24px;letter-spacing:.2em;color:var(--ember)}
.cond{position:absolute;left:120px;top:470px;width:1080px;border-collapse:collapse;font-size:28px}
.cond th{font-family:var(--mono);font-weight:400;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);text-align:left;padding:0 0 14px;border-bottom:1px solid var(--ash)}
.cond td{padding:16px 0;border-bottom:1px solid #1d181a;vertical-align:top}
.cond td:last-child{font-family:var(--mono);font-size:22px;color:var(--ember);white-space:nowrap;padding-left:20px}
.audit{position:absolute;right:120px;top:170px;width:520px;height:760px;border-left:1px solid var(--ash);padding-left:30px;font-family:var(--mono);font-size:19px;line-height:1.55;color:var(--smoke);overflow:hidden}
.audit h4{font-weight:400;font-size:18px;letter-spacing:.2em;color:var(--ember);margin:0 0 16px}
.audit div{opacity:0;transform:translateX(20px);transition:all .4s}
.audit div.in{opacity:1;transform:none}
.audit b{color:var(--bone);font-weight:600}
.vs{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--ink);z-index:3}
.vs>div{display:flex;flex-direction:column;justify-content:center;padding:0 110px;gap:24px}
.vs .y{font-family:var(--disp);font-weight:900;font-size:200px;line-height:.85}
.vs .l{background:#0c0a0b}
.vs .l .y{color:#4a4044}
.vs .r{background:linear-gradient(135deg,#1d070a,var(--ink))}
.vs .r .y{color:var(--red)}
.vs .line{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:48px;font-weight:500}

/* value words */
.value{font-family:var(--disp);font-weight:900;font-size:250px;line-height:.9;letter-spacing:.04em;color:var(--bone);text-shadow:0 0 70px rgba(229,18,31,.65)}
.value.rv{letter-spacing:.5em;filter:blur(20px);transform:none}
.value.rv.in{letter-spacing:.04em;filter:none;transition:opacity 1.2s,letter-spacing 1.6s cubic-bezier(.2,.8,.2,1),filter 1.2s}
.valwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:rgba(7,6,8,.88);z-index:4;opacity:0;pointer-events:none;transition:opacity .6s}
.valwrap.in{opacity:1}

/* part 2 */
.p2{position:absolute;left:160px;top:250px;display:flex;flex-direction:column;gap:20px}
.arab{font-family:var(--arab);font-weight:700;font-size:90px;color:var(--red);line-height:1.3}
.y2{display:flex;gap:30px;align-items:baseline;font-size:44px}
.y2 b{font-family:var(--disp);font-weight:900;font-size:80px;color:var(--red);width:180px}
.spot{position:absolute;inset:0;background:radial-gradient(circle 420px at 1300px 560px,transparent 0,rgba(0,0,0,.92) 100%);opacity:0;transition:opacity .8s;pointer-events:none;z-index:3}
.spot.in{opacity:1}
.pilot{position:absolute;left:1300px;top:560px;transform:translate(-50%,-50%);text-align:center;z-index:4;display:flex;flex-direction:column;gap:12px;align-items:center}
.pilot .nm{font-family:var(--disp);font-weight:900;font-size:180px;line-height:.9}

/* phone */
.phone{position:absolute;left:250px;top:76px;width:470px;height:910px;border-radius:70px;background:#0b090a;border:14px solid #221d20;box-shadow:0 0 0 2px #3a3236,0 40px 140px rgba(229,18,31,.25);overflow:hidden;display:flex;flex-direction:column}
.phone .notch{position:absolute;left:50%;top:12px;width:130px;height:34px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:3}
.phone .sb{display:flex;justify-content:space-between;padding:18px 34px 0;font-size:19px;font-weight:700;height:44px}
.app{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px 22px 22px}
.apph{display:flex;align-items:center;justify-content:space-between}
.apph b{font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:.06em}
.apph b i{color:var(--red);font-style:normal}
.watch{font-family:var(--mono);font-size:14px;color:var(--ember);display:flex;gap:8px;align-items:center}
.watch::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
.rate{background:var(--coal);border:1px solid var(--ash);border-radius:24px;padding:18px 20px}
.rate .pair{font-family:var(--mono);font-size:18px;color:var(--smoke);display:flex;justify-content:space-between}
.rate .val{font-family:var(--disp);font-weight:900;font-size:96px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:.08em;padding:5px 12px;border-radius:8px}
.chip.up{background:#2a0a0e;color:var(--ember);border:1px solid var(--red)}
.chip.dn{background:#1a1618;color:var(--bone);border:1px solid #5d5357}
.spark{width:100%;height:150px;display:block;margin-top:8px}
.spark .fl{font-family:var(--mono);font-size:12px;fill:var(--smoke)}
.lmsg{background:#1b0b0e;border:1px solid var(--red);border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:16px;line-height:1.38;min-height:110px}
.lmsg small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--ember);margin-bottom:4px}
.btns{display:flex;gap:10px;margin-top:auto}
.btns div{flex:1;text-align:center;padding:16px 8px;border-radius:16px;font-weight:800;font-size:18px;border:2px solid var(--ash);transition:all .3s}
.btns .pri{background:var(--red);border-color:var(--red);color:#fff}
.btns .sel{background:var(--bone);color:var(--ink);border-color:var(--bone);transform:scale(1.05)}
.ill{font-family:var(--mono);font-size:12px;color:#6c6166;text-align:center;letter-spacing:.1em}
.ptoast{position:absolute;left:24px;right:24px;bottom:120px;background:var(--bone);color:var(--ink);border-radius:20px;padding:18px;font-weight:800;font-size:20px;text-align:center;opacity:0;transform:translateY(30px);transition:all .5s cubic-bezier(.2,1.4,.4,1)}
.ptoast.in{opacity:1;transform:none}
.ptoast span{display:block;font-weight:500;font-size:16px;margin-top:4px}
.right{position:absolute;left:860px;right:120px;top:150px;display:flex;flex-direction:column;gap:30px}
.jb{align-self:flex-start;max-width:900px;background:#1f1a1d;border-radius:30px 30px 30px 8px;padding:26px 36px;font-size:44px;font-weight:500;line-height:1.25}
.jb small{display:block;font-family:var(--mono);font-size:18px;letter-spacing:.16em;color:var(--smoke);margin-bottom:8px}
.lb{display:flex;gap:28px;align-items:flex-start}
.lb .t{font-size:40px;line-height:1.3;min-height:150px}
.lb .t small{display:block;font-family:var(--mono);font-size:18px;letter-spacing:.16em;color:var(--ember);margin-bottom:8px}
.conf{display:flex;align-items:center;gap:26px}
.conf svg{width:150px;height:150px}
.conf .pc{font-family:var(--disp);font-weight:900;font-size:64px}
.conf .cl{font-family:var(--mono);font-size:20px;letter-spacing:.12em;color:var(--smoke);line-height:1.5}
.ring{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.nextpay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);z-index:6;font-family:var(--disp);font-weight:900;font-size:200px;animation:np 1.6s ease forwards;pointer-events:none}
@keyframes np{0%{opacity:0;letter-spacing:.4em}25%,70%{opacity:1;letter-spacing:.04em}100%{opacity:0}}

/* actions & predictions */
.trio{position:absolute;left:120px;right:120px;top:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.card{border-top:6px solid var(--red);padding-top:28px;display:flex;flex-direction:column;gap:20px}
.card .num{font-family:var(--disp);font-weight:900;font-size:120px;line-height:.8;color:var(--red)}
.card .who{font-family:var(--mono);font-size:22px;letter-spacing:.2em;color:var(--smoke);text-transform:uppercase}
.card h3{font-family:var(--disp);font-weight:700;font-size:56px;line-height:1;margin:0}
.card p{font-size:28px;line-height:1.4;margin:0;color:#d9d0cc}
.title-top{position:absolute;left:120px;top:150px}

/* finale */
.vals{position:absolute;left:100px;right:100px;top:300px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.vslot{height:300px;border:2px solid var(--ash);border-radius:24px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:80px;letter-spacing:.04em}
.vslot.empty{border:3px dashed var(--red);animation:pulse 1.6s infinite;color:transparent}
.vslot.courage{border:3px solid var(--red);background:var(--red);color:#fff;animation:none;font-size:92px;box-shadow:0 0 140px rgba(229,18,31,.8)}
.fin{position:absolute;left:0;right:0;top:700px;text-align:center;font-family:var(--disp);font-weight:700;font-size:84px;line-height:1.05}
.thanks{font-family:var(--disp);font-weight:900;font-size:300px;line-height:.85}
.signoff{display:flex;gap:40px;justify-content:center}
.signoff .agent-mini.dimmed{opacity:.3}
.signoff .agent-mini{transition:opacity .3s;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--mono);font-size:18px;letter-spacing:.14em;color:var(--smoke)}

/* La'eeb caricature */
.lchar{display:block;width:100%;height:auto;overflow:visible}
.lchar .bob{animation:lbob 2.6s ease-in-out infinite}
@keyframes lbob{50%{transform:translateY(-7px)}}
.lchar .blink,.lchar .wavearm,.lchar .mouth,.lchar .coin{transform-box:fill-box;transform-origin:center}
.lchar .blink{animation:lblink 4.6s infinite}
@keyframes lblink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.lchar .wavearm{transform-origin:100% 100%;animation:lwave 1.8s ease-in-out infinite}
@keyframes lwave{50%{transform:rotate(-16deg)}}
.lchar .coin{animation:lcoin 3.2s ease-in-out infinite}
@keyframes lcoin{0%,78%,100%{transform:scaleX(1)}86%{transform:scaleX(.05)}94%{transform:scaleX(1)}}
.lchar .mouth{opacity:0}
.talk .lchar .mouth,.talk.lchar .mouth{opacity:1;animation:lmouth .17s ease-in-out infinite alternate}
.talk .lchar .smile{opacity:0}
@keyframes lmouth{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.av.laeeb{background:#1b0b0e;overflow:hidden;padding:0}
.av.laeeb .lchar .bob,.av.laeeb .lchar .wavearm{animation:none}
.lbig{flex:none;width:190px;filter:drop-shadow(0 18px 40px rgba(229,18,31,.35))}
.lbig.talk{animation:lbump .5s ease-in-out infinite alternate}
@keyframes lbump{to{transform:scale(1.04) rotate(-2deg)}}
.lhero .lbig{width:300px}
.lhero{position:absolute;right:220px;top:110px;width:320px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px}
.lhero .hi{align-self:flex-start;margin-left:-110px;background:var(--bone);color:var(--ink);font-weight:800;font-size:30px;padding:12px 22px;border-radius:24px 24px 24px 6px}
/* money to many countries */
.mcap{position:absolute;left:120px;top:150px;z-index:3}
.p2.gone{opacity:.06!important}
#lh.to-corner{transform:translate(110px,-10px) scale(.7);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
/* 2022 La'eeb image slot */
.m22{position:absolute;right:180px;top:110px;width:420px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.m22 img{max-width:400px;max-height:470px;object-fit:contain;border-radius:28px;box-shadow:0 0 0 2px var(--ash),0 30px 90px rgba(229,18,31,.35)}
.m22ph{width:380px;height:420px;border:2px dashed var(--ash);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;font-family:var(--mono);font-size:18px;line-height:1.5;color:var(--smoke)}
.m22ph .ball{width:150px;animation:bounce 1.1s cubic-bezier(.5,0,.5,1) infinite alternate}
.m22 .kick{position:absolute;width:70px;left:-30px;bottom:40px;animation:bounce .55s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes bounce{from{transform:translateY(-34px) rotate(0)}to{transform:translateY(0) rotate(160deg)}}
/* voice studio */
#studio{position:absolute;inset:0;z-index:30;background:rgba(5,4,5,.97);display:none;padding:60px 90px;overflow:auto;font-size:22px}
#studio.on{display:block}
#studio h2{font-family:var(--disp);font-weight:900;font-size:70px;margin:0 0 6px}
#studio p{color:var(--smoke);margin:0 0 26px;max-width:1500px;line-height:1.5}
#studio .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:34px}
#studio .ag{background:var(--coal);border:1px solid var(--ash);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
#studio .ag header{display:flex;gap:14px;align-items:center;font-family:var(--disp);font-weight:900;font-size:36px}
#studio select,#studio input[type=range]{width:100%;font-size:18px;background:#0b090a;color:var(--bone);border:1px solid var(--ash);border-radius:8px;padding:8px}
#studio label{font-family:var(--mono);font-size:15px;color:var(--smoke);letter-spacing:.1em}
#studio button{font:700 18px var(--body);color:#fff;background:var(--red);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
#studio button.ghost{background:transparent;border:1px solid var(--ash);color:var(--bone)}
#studio button:focus-visible,#studio select:focus-visible{outline:3px solid var(--bone);outline-offset:2px}
#studio table{width:100%;border-collapse:collapse}
#studio td{border-top:1px solid var(--ash);padding:12px 10px;vertical-align:middle;font-size:19px;line-height:1.4}
#studio td:first-child{font-family:var(--mono);color:var(--ember);white-space:nowrap}
#studio .has{color:var(--ember);font-family:var(--mono);font-size:15px}
#studio .close{position:sticky;top:0;float:right}
@media (prefers-reduced-motion:reduce){.rv,.value.rv{transition-duration:.01s!important}.siren,.talk .av,.talk .wave i{animation:none!important}}

/* Sukhi's agent: the Dutch duck who knocks on the screen */
.sc.shake{animation:knockShake .32s cubic-bezier(.3,.7,.4,1)}
@keyframes knockShake{0%{transform:none}20%{transform:translate(-14px,6px) rotate(-.4deg)}45%{transform:translate(12px,-5px) rotate(.35deg)}70%{transform:translate(-6px,3px)}100%{transform:none}}
.knockw{position:absolute;font-family:var(--disp);font-weight:900;font-size:120px;letter-spacing:.04em;color:var(--bone);opacity:0;transform:scale(1.8) rotate(-8deg);transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);text-shadow:0 0 40px rgba(229,18,31,.6)}
.knockw.in{opacity:1;transform:scale(1) rotate(-8deg)}
.crack{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
.crack path{fill:none;stroke:rgba(243,236,232,.75);stroke-width:2.5;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset .35s ease-out;filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
.crack.in path{stroke-dashoffset:0}
.duckwin{position:absolute;left:150px;top:150px;width:780px;border-radius:26px;overflow:hidden;background:#d9d2cc;border:3px solid var(--red);box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 80px rgba(229,18,31,.35);
  transform:perspective(1600px) rotateY(-92deg);transform-origin:left center;opacity:0;transition:transform 1s cubic-bezier(.2,1.25,.35,1),opacity .3s}
.duckwin.in{transform:perspective(1600px) rotateY(0);opacity:1}
.duckwin.out{transform:perspective(1600px) rotateY(-92deg) !important;opacity:0;transition:transform .7s cubic-bezier(.6,0,.8,.4),opacity .5s .3s}
.duckwin video,.duckwin img{display:block;width:100%;aspect-ratio:600/478;object-fit:cover}
.duckwin img.bob{animation:duckBob 1.4s ease-in-out infinite}
@keyframes duckBob{50%{transform:translateY(-6px) rotate(-1deg)}}
.duckwin .bar{display:flex;align-items:center;gap:14px;padding:16px 22px;background:#0b090a;font-family:var(--mono);font-size:22px;letter-spacing:.16em;color:var(--bone)}
.duckwin .bar .nl{display:inline-flex;flex-direction:column;width:42px;height:28px;border-radius:4px;overflow:hidden}
.duckwin .bar .nl i{flex:1}
.duckwin .bar .live{margin-left:auto;color:var(--red);display:flex;align-items:center;gap:8px}
.duckwin .bar .live:before{content:'';width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.dstamp{position:absolute;left:1010px;top:150px;font-family:var(--disp);font-weight:900;font-size:76px;line-height:1;color:var(--red);border:6px solid var(--red);padding:14px 26px;border-radius:14px;transform:rotate(-4deg) scale(2.2);opacity:0;transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .2s}
.dstamp.in{transform:rotate(-4deg) scale(1);opacity:1}
.dbub{position:absolute;left:1010px;top:370px;width:780px;min-height:200px;background:#160a0c;border:1px solid #3a1d22;border-radius:26px;padding:34px 40px;font-size:36px;line-height:1.38;color:var(--bone);white-space:pre-line}
.dbub small{display:block;font-family:var(--mono);font-size:20px;letter-spacing:.2em;color:var(--red);margin-bottom:14px}
.knockw.gone,.crack.gone{opacity:0!important;transition:opacity .4s}
.dbye{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:var(--disp);font-weight:900;font-size:64px;color:var(--smoke)}

/* Aaron's desktop and the incident */
.desk{position:absolute;left:60px;right:60px;top:40px;bottom:60px;background:#0d0a0c;border:1px solid var(--ash);border-radius:22px;overflow:hidden}
.dtb{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--ash);font-family:var(--mono);font-size:20px;letter-spacing:.14em;color:var(--smoke)}
.dtb b{color:var(--bone)} .dtb .dpar{color:var(--ember)}
.pas{position:absolute;left:30px;top:100px;width:1060px;bottom:30px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22px}
.pa{background:var(--coal);border:1px solid var(--ash);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;gap:10px;overflow:hidden;transition:border-color .4s,box-shadow .4s,opacity .7s,transform .8s}
.pa header{display:flex;justify-content:space-between;align-items:center}
.pa header b{font-family:var(--disp);font-weight:900;font-size:40px}
.pa .st{font-family:var(--mono);font-size:16px;letter-spacing:.16em;color:var(--ember);display:flex;align-items:center;gap:8px}
.pa .st:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
.pa .dd{font-size:22px;color:var(--smoke)}
.pa .pb{height:6px;border-radius:3px;background:#221c1f;overflow:hidden}
.pa .pb i{display:block;height:100%;width:40%;background:var(--red);animation:pbar 2.2s ease-in-out infinite}
@keyframes pbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.pa .feed{font-family:var(--mono);font-size:20px;line-height:1.7;color:var(--bone);display:flex;flex-direction:column}
.pa .feed div{animation:feedIn .5s ease both}
.pa .feed div:not(:last-child){color:#8d8186}
@keyframes feedIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pa.par{border-color:var(--red);box-shadow:0 0 50px rgba(229,18,31,.25)}
.att{position:absolute;right:30px;top:100px;width:640px;bottom:30px;display:flex;flex-direction:column;gap:16px}
.att .ah{font-family:var(--mono);font-size:18px;letter-spacing:.2em;color:var(--ember)}
.att .ai{background:#16100f;border:1px solid #3a1d22;border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.att .ai b{font-size:28px} .att .ai span{font-size:20px;color:var(--smoke)}
.att .ai .acts{font-style:normal;font-family:var(--mono);font-size:16px;letter-spacing:.1em;color:#5d5357;transition:color .3s}
.att .ai.act{border-color:var(--red)} .att .ai.act .acts{color:var(--bone)}
.att .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.att .chips .rule{font-size:17px}
.p3tag{position:absolute;right:90px;top:58px;z-index:3;font-family:var(--mono);font-size:20px;letter-spacing:.2em;color:#fff;background:var(--red);padding:6px 14px;border-radius:8px}
.alerts{position:absolute;right:90px;top:140px;width:640px;display:flex;flex-direction:column;gap:12px;z-index:3}
.alr{background:#1b0b0e;border:2px solid var(--red);border-radius:14px;padding:16px 20px;font-size:26px;font-weight:700;display:flex;gap:14px;align-items:center;box-shadow:0 14px 50px rgba(0,0,0,.7);transition:opacity .6s,transform .7s cubic-bezier(.6,0,.3,1)}
.alr i{font-style:normal;color:var(--red);animation:pulse 1s infinite}
.alr.merge.in{opacity:0;transform:translate(-300px,140px) scale(.5)}
.inc{position:absolute;left:340px;top:230px;width:900px;z-index:4;background:#120607;border:3px solid var(--red);border-radius:22px;padding:30px 36px;box-shadow:0 0 120px rgba(229,18,31,.4);display:flex;flex-direction:column;gap:12px}
.inc small{font-family:var(--mono);font-size:18px;letter-spacing:.2em;color:var(--ember)}
.inc b{font-family:var(--disp);font-weight:900;font-size:56px;line-height:1}
.inc .ev{display:flex;flex-direction:column;gap:6px;font-size:26px;margin-top:8px}
.inc .ev .warn{color:var(--ember)}
#ins{z-index:5}
/* value slots strip */
.vstrip{display:flex;gap:10px}
.vstrip span{width:150px;height:44px;border:2px dashed var(--red);border-radius:10px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.06em;animation:pulse 1.8s infinite}
.vstrip span.f{border-style:solid;animation:none;color:var(--bone)}
.vstrip.top{position:absolute;right:120px;top:96px}
.mtg .bar .vstrip span{width:96px;height:34px}
.mtg .bar .rec{white-space:nowrap}
.vstrip.big{position:absolute;left:0;right:0;top:150px;justify-content:center;gap:24px}
.vstrip.big span{width:360px;height:110px;font-size:58px;border-color:var(--bone)}
.vstrip.big span:last-child{background:var(--red);border-color:var(--red);color:#fff}
/* OneFamily reveal: what each agent knows */
.agent-node .kn{font-size:19px;line-height:1.3;color:var(--bone);max-width:270px;opacity:0}
.agent-node .kn.in{opacity:1}
.agent-node.cur .av{box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--red),0 0 60px rgba(229,18,31,.7)}
.langs{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;max-width:900px}
.langs span{font-size:30px;padding:6px 16px;border:1px solid var(--ash);border-radius:999px;animation:langPop 2.4s ease-in-out infinite}
@keyframes langPop{0%,100%{border-color:var(--ash);color:var(--smoke)}50%{border-color:var(--red);color:var(--bone)}}
/* Rate Advisor at work */
.push{position:absolute;left:180px;top:150px;width:610px;z-index:6;background:rgba(243,236,232,.96);color:var(--ink);border-radius:26px;padding:20px 26px;font-size:27px;font-weight:600;line-height:1.3;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.push b{display:block;font-family:var(--mono);font-size:17px;letter-spacing:.16em;color:var(--blood);margin-bottom:6px}
.pts{display:flex;flex-direction:column;gap:16px;margin-top:10px}
.pt{font-size:36px;line-height:1.25;border-left:6px solid var(--red);padding-left:22px}
.pt b{color:var(--ember)}
.phone .btns div.sel{border-color:var(--red)}
/* options with impact */
.opts.o3{top:290px;align-items:stretch}
.opts.o3 .opt{min-height:0;padding:28px;gap:14px;cursor:default;transition:border-color .3s,opacity .6s,transform .8s}
.opts.o3 .opt h3{font-size:54px;line-height:1.05;min-height:0}
.opts.o3 .opt{justify-content:center;min-height:420px}
.imp{display:flex;flex-direction:column;gap:8px}
.ir{display:flex;justify-content:space-between;gap:12px;font-size:20px;border-top:1px solid #241d20;padding-top:8px;opacity:.15;transition:opacity .4s}
.ir.in{opacity:1}
.ir .k{font-family:var(--mono);font-size:15px;letter-spacing:.1em;color:var(--smoke);text-transform:uppercase;flex:none;width:150px}
.ir .lv{text-align:right}
.ir .lv.h{color:#ff6b5e} .ir .lv.m{color:#f3c86b} .ir .lv.l{color:#8fe3a8}

<script>
(() => {
"use strict";
/* ---------- stage scaling ---------- */
const stage = document.getElementById('stage');
function fit(){
  const k = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `scale(${k}) translate(-50%,-50%)`;
  stage.style.transformOrigin = '0 0';
  stage.style.left = '50%'; stage.style.top = '50%';
  stage.style.transform = `translate(${-960*k}px,${-540*k}px) scale(${k})`;
}
addEventListener('resize', fit); fit();

/* ---------- utilities ---------- */
let FAST = false;               // true while rebuilding a scene silently (going back)
let timers = [];
let CUE = null;   // the beat currently running ("sceneId.beatIndex"), so its sound can be swapped in the studio
const later = (fn, ms) => { if (FAST) { fn(); return; } const c = CUE; timers.push(setTimeout(() => { const p = CUE; CUE = c; try { fn(); } finally { CUE = p; } }, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
// accept (root, selector) or (selector, root)
const $ = (r, s) => typeof r === 'string' ? s.querySelector(r) : r.querySelector(s);
const $$ = (r, s) => typeof r === 'string' ? [...s.querySelectorAll(r)] : [...r.querySelectorAll(s)];
const on = (r, s) => $$(r, s).forEach(e => e.classList.add('in'));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- audio: everything is synthesised live, nothing to download ---------- */
let ctx = null, master = null, musicBus = null, drone = null, muted = false;
function A(){
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function env(g, t, a, d, peak){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);

function osc(type, f, t, a, d, peak, f2, out){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + d);

  if (!nbuf) { nbuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate); const c = nbuf.getChannelData(0); for (let i=0;i<c.length;i++) c[i] = Math.random()*2-1; }
  const s = ctx.createBufferSource(); s.buffer = nbuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f1, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + a + d);
  const g = ctx.createGain(); env(g, t, a, d, peak);
  s.connect(f).connect(g).connect(out || master); s.start(t); s.stop(t + a + d + .05);

  impact(t){ osc('sine',150,t,.005,1.4,.9,32); noise(t,.005,.9,.5,'lowpass',1400,90); },
  shimmer(t){ [1568,2093,2637,3136,4186].forEach((f,i)=>osc('sine',f,t+i*.07,.01,1.8,.07)); },
  warp(t){ osc('sawtooth',55,t,3.3,.35,.13,900); osc('sawtooth',57,t,3.3,.35,.1,940); noise(t,3.3,.4,.35,'bandpass',300,7000,2); SFX.impact(t+3.6); SFX.shimmer(t+3.7); },

  soft(t){ osc('sine',1318,t,.004,.12,.06); },
  tick(t){ osc('square',1900,t,.002,.03,.04); },
  stamp(t){ osc('sine',95,t,.003,.55,1,38); noise(t,.002,.3,.6,'lowpass',900,120); },

  heart(t){ osc('sine',62,t,.01,.25,.8,40); osc('sine',58,t+.28,.01,.3,.6,38); },
  send(t){ noise(t,.25,.4,.3,'highpass',400,9000); osc('sine',880,t+.55,.005,.2,.12); osc('sine',1318,t+.65,.005,.5,.12); },
  lock(t){ osc('square',600,t,.002,.05,.08); osc('square',900,t+.07,.002,.08,.08); SFX.ping(t+.2); },
  knock(t){ osc('sine',140,t,.002,.12,.9,70); noise(t,.001,.07,.7,'lowpass',2200,300,1.5); noise(t,.001,.03,.25,'bandpass',3200,0,2); },

  if (m === 'embers') for (let i=0;i<(RM?30:90);i++) FX.p.push({x:Math.random()*1920,y:Math.random()*1080,v:.2+Math.random()*.7,r:.6+Math.random()*2.2,a:Math.random()});
  if (m === 'warp') for (let i=0;i<(RM?120:420);i++) FX.p.push(star());
  if (m === 'network') for (let i=0;i<(RM?40:110);i++){ const a=Math.random()*Math.PI*2, r=200+Math.random()*900; FX.p.push({x:960+Math.cos(a)*r,y:540+Math.sin(a)*r*.6,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,hx:960+Math.cos(a)*(90+Math.random()*60),hy:430+Math.sin(a)*(90+Math.random()*60)}); }
  if (m === 'multi') { FX.t = 0; FX.dest = [
      ['EGYPT','EGP','E£',300,520],['KENYA','KES','KSh',420,930],['PAKISTAN','PKR','₨',1060,430],['NEPAL','NPR','रू',1290,420],
      ['INDIA','INR','₹',1210,650],['BANGLADESH','BDT','৳',1500,610],['SRI LANKA','LKR','Rs',1300,930],['PHILIPPINES','PHP','₱',1760,820]]; }
  if (m === 'arc') FX.arc = Object.assign({x1:200,y1:760,x2:1720,y2:760,h:520,t:0,label1:'DOHA',label2:'HOME',coins:false,arrived:false}, opts||{});
}
function star(){ const a=Math.random()*Math.PI*2; return {a, d:Math.random()*60, z:Math.random()*1}; }
function burst(x, y, n){
  if (FAST) return;
  const hue = Math.random() < .7 ? [229,18,31] : [243,236,232];
  for (let i=0;i<(n||(RM?30:110));i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*7; FX.sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:Math.random()<.25?[255,200,180]:hue}); }
}
let fwTimer = null;
function fireworks(sec){
  if (FAST) return;
  clearInterval(fwTimer); let n = 0;
  fwTimer = setInterval(() => { burst(200+Math.random()*1520, 120+Math.random()*450); if (++n > sec*2.2) clearInterval(fwTimer); }, 450);
  timers.push(fwTimer);
}
function frame(){
  const W=1920,H=1080;
  if (FX.mode === 'warp') { g2.fillStyle = 'rgba(7,6,8,.28)'; g2.fillRect(0,0,W,H); }
  else g2.clearRect(0,0,W,H);
  if (FX.mode === 'embers') {
    FX.p.forEach(p => { p.y -= p.v; p.x += Math.sin((p.y+p.r*100)/90)*.3; if (p.y < -10){ p.y = H+10; p.x = Math.random()*W; }
      g2.fillStyle = `rgba(229,18,31,${.25+.35*Math.abs(Math.sin(p.a+=.01))})`; g2.beginPath(); g2.arc(p.x,p.y,p.r,0,7); g2.fill(); });
  } else if (FX.mode === 'warp') {
    FX.speed = Math.min(FX.speed + .006, 1);
    const sp = 2 + FX.speed*48;
    FX.p.forEach(s => { const d0 = s.d; s.d += sp*(.3+s.z); if (s.d > 1300) { Object.assign(s, star()); return; }
      const x0=960+Math.cos(s.a)*d0, y0=540+Math.sin(s.a)*d0, x1=960+Math.cos(s.a)*s.d, y1=540+Math.sin(s.a)*s.d;
      g2.strokeStyle = s.z > .7 ? 'rgba(243,236,232,.9)' : 'rgba(229,18,31,.9)'; g2.lineWidth = 1 + s.z*2.5;
      g2.beginPath(); g2.moveTo(x0,y0); g2.lineTo(x1,y1); g2.stroke(); });
  } else if (FX.mode === 'network') {
    FX.gather = Math.min(1, FX.gather + (FX.gatherOn ? .012 : 0));
    const k = FX.gather*FX.gather*(3-2*FX.gather);
    FX.p.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x<0||p.x>W) p.vx*=-1; if (p.y<0||p.y>H) p.vy*=-1; p.dx = p.x + (p.hx-p.x)*k*.85; p.dy = p.y + (p.hy-p.y)*k*.85; });
    for (let i=0;i<FX.p.length;i++) for (let j=i+1;j<FX.p.length;j++){ const a=FX.p[i], b=FX.p[j], d=Math.hypot(a.dx-b.dx,a.dy-b.dy); if (d<170){ g2.strokeStyle=`rgba(229,18,31,${(1-d/170)*.35})`; g2.lineWidth=1; g2.beginPath(); g2.moveTo(a.dx,a.dy); g2.lineTo(b.dx,b.dy); g2.stroke(); } }
    FX.p.forEach(p => { g2.fillStyle='rgba(243,236,232,.7)'; g2.beginPath(); g2.arc(p.dx,p.dy,2,0,7); g2.fill(); });
  } else if (FX.mode === 'arc' && FX.arc) {
    const A1 = FX.arc; A1.t = (A1.t + (RM?.004:.008)) % (A1.coins ? 1.9 : 1.4);
    const cx=(A1.x1+A1.x2)/2, cy=A1.y1-A1.h;
    const pt = t => [(1-t)*(1-t)*A1.x1+2*(1-t)*t*cx+t*t*A1.x2, (1-t)*(1-t)*A1.y1+2*(1-t)*t*cy+t*t*A1.y2];
    g2.setLineDash([4,10]); g2.strokeStyle='rgba(161,149,154,.45)'; g2.lineWidth=2; g2.beginPath(); g2.moveTo(A1.x1,A1.y1); g2.quadraticCurveTo(cx,cy,A1.x2,A1.y2); g2.stroke(); g2.setLineDash([]);
    const tt = Math.min(A1.t,1);
    if (A1.coins) {
      // a train of coins: Qatari riyal leaving Doha, flipping to Indian rupees at the midpoint
      for (let i=0;i<6;i++){ const t = A1.t - i*.11; if (t<0 || t>1) continue; if (t > .98) A1.arrived = true;
        const [x,y] = pt(t), inr = t >= .5, sx = Math.max(.08, Math.min(1, Math.abs(t-.5)*14)), sc = 1 + .18*Math.sin(t*Math.PI);
        g2.save(); g2.translate(x,y); g2.scale(sx*sc, sc);
        g2.shadowColor = 'rgba(229,18,31,.8)'; g2.shadowBlur = 24;
        g2.fillStyle = inr ? '#e5121f' : '#f3ece8'; g2.beginPath(); g2.arc(0,0,32,0,7); g2.fill();
        g2.shadowBlur = 0; g2.lineWidth = 3; g2.strokeStyle = inr ? '#ff8a80' : '#a1959a'; g2.beginPath(); g2.arc(0,0,26,0,7); g2.stroke();
        g2.fillStyle = inr ? '#fff' : '#070608'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
        g2.font = inr ? '800 34px Manrope, sans-serif' : '700 17px "JetBrains Mono", monospace'; g2.fillText(inr ? '₹' : 'QAR', 0, inr ? 1 : 1);
        g2.restore(); }
    } else
    for (let i=0;i<26;i++){ const t = tt - i*.012; if (t<0) break; const [x,y]=pt(t); g2.fillStyle=`rgba(255,75,62,${1-i/26})`; g2.beginPath(); g2.arc(x,y,7-i*.22,0,7); g2.fill(); }
    [[A1.x1,A1.y1,A1.label1],[A1.x2,A1.y2,A1.label2]].forEach(([x,y,l]) => { g2.fillStyle='#e5121f'; g2.beginPath(); g2.arc(x,y,10,0,7); g2.fill(); g2.strokeStyle='rgba(229,18,31,.4)'; g2.lineWidth=2; g2.beginPath(); g2.arc(x,y,22+8*Math.sin(performance.now()/300),0,7); g2.stroke(); g2.fillStyle='#a1959a'; g2.font='600 20px "JetBrains Mono",monospace'; g2.textAlign='center'; g2.textBaseline='alphabetic'; g2.fillText(l,x,y+52); });
    g2.font='800 34px "Big Shoulders Display", Impact, sans-serif'; g2.fillStyle='#f3ece8';
    if (A1.sub1) g2.fillText(A1.sub1, A1.x1, A1.y1+94);
    if (A1.sub2 && A1.arrived) { g2.fillStyle='#ff4b3e'; g2.fillText(A1.sub2, A1.x2, A1.y2+94); }
  }
  if (FX.mode === 'multi' && FX.dest) {
    // Qatar in the middle, a corridor to each home country; coins leave as QAR and arrive in the local currency
    FX.t += RM ? .0025 : .005;
    const ox = 760, oy = 700;
    FX.dest.forEach(([name, code, sym, x, y], di) => {
      const cx = (ox + x) / 2, cy = Math.min(oy, y) - 120 - Math.abs(x - ox) * .12;
      const pt = t => [(1-t)*(1-t)*ox + 2*(1-t)*t*cx + t*t*x, (1-t)*(1-t)*oy + 2*(1-t)*t*cy + t*t*y];
      const show = Math.min(1, Math.max(0, FX.t*3 - di*.18));            // corridors open one after another
      if (show <= 0) return;
      g2.setLineDash([4,9]); g2.strokeStyle = `rgba(161,149,154,${.45*show})`; g2.lineWidth = 2; g2.beginPath(); g2.moveTo(ox,oy); g2.quadraticCurveTo(cx,cy,x,y); g2.stroke(); g2.setLineDash([]);
      for (let c = 0; c < 3; c++) {
        const t = ((FX.t*1.1 + di*.137 + c*.33) % 1); if (show < 1 && t > show) continue;
        const [px, py] = pt(t), local = t >= .5, sx = Math.max(.08, Math.min(1, Math.abs(t-.5)*14));
        g2.save(); g2.translate(px, py); g2.scale(sx, 1);
        g2.shadowColor = 'rgba(229,18,31,.8)'; g2.shadowBlur = 16;
        g2.fillStyle = local ? '#e5121f' : '#f3ece8'; g2.beginPath(); g2.arc(0,0,21,0,7); g2.fill(); g2.shadowBlur = 0;
        g2.fillStyle = local ? '#fff' : '#070608'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
        g2.font = local ? `800 ${sym.length > 1 ? 15 : 22}px Manrope, "Noto Sans Devanagari", "Nirmala UI", sans-serif` : '700 12px "JetBrains Mono", monospace';
        g2.fillText(local ? sym : 'QAR', 0, 1); g2.restore();
      }
      g2.globalAlpha = show;
      g2.fillStyle = '#e5121f'; g2.beginPath(); g2.arc(x, y, 8, 0, 7); g2.fill();
      g2.textAlign = 'center'; g2.textBaseline = 'alphabetic';
      g2.fillStyle = '#f3ece8'; g2.font = '800 26px "Big Shoulders Display", Impact, sans-serif'; g2.fillText(name, x, y + 40);
      g2.fillStyle = '#ff4b3e'; g2.font = '600 16px "JetBrains Mono", monospace'; g2.fillText(code, x, y + 62);
      g2.globalAlpha = 1;
    });
    g2.fillStyle = '#e5121f'; g2.beginPath(); g2.arc(ox, oy, 16, 0, 7); g2.fill();
    g2.strokeStyle = 'rgba(229,18,31,.45)'; g2.lineWidth = 3; g2.beginPath(); g2.arc(ox, oy, 32 + 10*Math.sin(performance.now()/300), 0, 7); g2.stroke();
    g2.fillStyle = '#f3ece8'; g2.textAlign = 'center'; g2.font = '900 34px "Big Shoulders Display", Impact, sans-serif'; g2.fillText('QATAR', ox, oy + 62);
    g2.fillStyle = '#a1959a'; g2.font = '600 16px "JetBrains Mono", monospace'; g2.fillText('QAR', ox, oy + 84);
  }
  if (FX.sparks.length) {
    FX.sparks = FX.sparks.filter(s => s.l > 0);
    FX.sparks.forEach(s => { s.x+=s.vx; s.y+=s.vy; s.vy+=.09; s.vx*=.985; s.vy*=.985; s.l-=.012;
      g2.fillStyle=`rgba(${s.c[0]},${s.c[1]},${s.c[2]},${Math.max(0,s.l)})`; g2.fillRect(s.x,s.y,3,3); });
  }
  requestAnimationFrame(frame);
}

/* ---------- live countdown to "tomorrow 08:00" ---------- */
function cdText(){
  const now = new Date(), t = new Date(now); t.setDate(t.getDate()+1); t.setHours(8,0,0,0);
  let s = Math.max(0, Math.floor((t-now)/1000)); const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60); s%=60;
  return [h,m,s].map(x => String(x).padStart(2,'0')).join(':');
}
setInterval(() => { $$(document,'.cd').forEach(e => e.textContent = cdText()); }, 1000);

function spark(hist, fc, band, labels){
  const all = hist.concat(fc), lo = Math.min(...all) - band - .02, hi = Math.max(...all) + band + .02;
  const n = hist.length + fc.length - 1, W = 400, H = 130, X = i => 6 + i*(W-12)/n, Y = v => 10 + (hi-v)/(hi-lo)*(H-30);
  const hp = hist.map((v,i) => `${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const o = hist.length - 1;
  const fp = fc.map((v,i) => `${i?'L':'M'}${X(o+i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const up = fc.map((v,i) => `${X(o+i).toFixed(1)},${Y(v+band*i/(fc.length-1)).toFixed(1)}`);
  const dn = fc.map((v,i) => `${X(o+i).toFixed(1)},${Y(v-band*i/(fc.length-1)).toFixed(1)}`).reverse();
  return `<svg class="spark" viewBox="0 0 ${W} ${H+10}" aria-label="Rate history and expected range">
    <line x1="${X(o)}" y1="4" x2="${X(o)}" y2="${H-14}" stroke="#2b2427" stroke-width="1"/>
    <polygon class="band" points="${up.concat(dn).join(' ')}" fill="rgba(229,18,31,.18)"/>
    <path d="${hp}" fill="none" stroke="#f3ece8" stroke-width="3" stroke-linejoin="round"/>
    <path d="${fp}" fill="none" stroke="#ff4b3e" stroke-width="3" stroke-dasharray="6 6"/>
    <circle cx="${X(o)}" cy="${Y(hist[o])}" r="6" fill="#e5121f"/>
    <text class="fl" x="${X(o)-6}" y="${H+6}" text-anchor="end">NOW</text>
    <text class="fl" x="${W-6}" y="${H+6}" text-anchor="end">${labels}</text></svg>`;
}

  const ox = parseFloat(el.style.left), oy = parseFloat(el.style.top);

  el.style.transition = `left ${ms}ms linear, top ${ms}ms linear`;

  if (!ms) { el.classList.remove('walking'); return 0; }

  return ms;

    const agent = (k, ids, withCard) => ({ n:[AGENTS[k].name.toUpperCase()+' – '+AGENTS[k].short.toUpperCase(), '“'+ids.map(id=>show(LINE[id][2])).join(' ')+'”'+(withCard?' Action card: '+k+' • '+ACT[k]:'')], run(r){
      const c = $('#mcp', r); c.classList.add('in'); c.classList.remove('dim'); c.style.setProperty('--bc', BOT_C[k]); $('#mcw', r).textContent = AGENTS[k].name.toUpperCase()+' · '+AGENTS[k].short.toUpperCase();

      agent('NORA',['n-1','n-2','n-3','n-4'],true),
      human('AARON','“Then we say that openly: what we know, what we don’t, and what we are fixing.”'),

      agent('NADIA',['nd-1'],false),
      human('GABY','“Let’s pause there. Nadia, what does Customer Care need to do this well?”'),

  if (b.dataset.test) { const k = b.dataset.test; const id = LINES.find(l => l[0]===k && !l[3])?.[1] || LINES.find(l=>l[0]===k)[1]; say(id); }

  if (b.id === 'dreset') { duckText = DUCK_DEFAULT; store.set('ofti2030.duckText', duckText); renderStudio(); }
  if (b.dataset.del) { delRec(b.dataset.del); renderStudio(); }
  if (b.dataset.delimg) { delRec('img:' + b.dataset.delimg); renderStudio(); }
  if (b.dataset.prev) { const key = b.dataset.prev, c = cues[key] || 'default';
    if (c !== 'default') playCue(c, key);
    else { const [sid, i] = key.split('.'); const d = defaultSounds(SCENES.find(x => x.id === sid).beats[+i]); if (d[0]) playCue(d[0], key); } } });
function toggleStudio(v){ const s = v === undefined ? !studioEl.classList.contains('on') : v; if (s) { if (synth) voices = synth.getVoices(); renderStudio(); } else stopVoice(); studioEl.classList.toggle('on', s); }

/* ---------- input: keyboard, presentation clickers, mouse ---------- */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key;
  if (studioEl.classList.contains('on')) { if (k === 'Escape' || k === 'v' || k === 'V') toggleStudio(false); return; }
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)) { e.preventDefault(); if (si === 0) arm(); next(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'b' || k === 'B' || k === '.') blackEl.classList.toggle('on');
  else if (k === 'f' || k === 'F' || k === 'F5') { e.preventDefault(); fullscreen(); }
  else if (k === 'n' || k === 'N') notes.classList.toggle('on');
  else if (k === 'h' || k === 'H') hud.classList.toggle('off');
  else if (k === 'm' || k === 'M') { muted = !muted; if (muted) { stopMusic(true); if (synth) synth.cancel(); } flash(muted ? 'Sound muted' : 'Sound on'); }
  else if (k === 'a' || k === 'A') toggleDrone();
  else if (k === 'v' || k === 'V') toggleStudio(true);
  else if (k === 'r' || k === 'R') replay();
  else if (k === '1' || k === '2' || k === '3') vote(+k - 1);
  else if (k === 'Home') rebuild(1, 0);
  else if (k === 'Escape') blackEl.classList.remove('on');
});
stage.addEventListener('click', e => { if (e.target.closest('#studio,.opt,button,#notes')) return; if (si === 0) return; A(); next(); });
stage.addEventListener('contextmenu', e => { e.preventDefault(); prev(); });

render(0); paint();
})();
</script>
